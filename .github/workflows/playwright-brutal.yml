name: Playwright Brutal CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  playwright-tests:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        project:
          - dummyjson-project
          - data-project
          - chain-project

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          CI: true
          BASE_URL: https://dummyjson.com
        run: |
          npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.project }}-${{ github.run_number }}
          path: playwright-brutal-3/playwright-report/
          retention-days: 14